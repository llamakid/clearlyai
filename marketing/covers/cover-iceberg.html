<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Cover — Iceberg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #555; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .canvas {
    width: 1920px; height: 1080px;
    position: relative; overflow: hidden;
    background: #f5f3ee;
    flex-shrink: 0;
  }
  svg { position: absolute; inset: 0; }
  .label-top {
    position: absolute; top: 150px; left: 250px;
    font-family: 'Inter', sans-serif; color: #1c2b35;
  }
  .label-top .eyebrow {
    font-size: 26px; font-weight: 600; letter-spacing: 3px;
    text-transform: uppercase; color: #3d7a8a; margin-bottom: 18px;
  }
  .label-top h1 {
    font-family: 'DM Serif Display', serif; font-weight: 400;
    font-size: 76px; line-height: 1.12; max-width: 720px;
  }
  .callout-above {
    position: absolute; top: 285px; right: 200px; text-align: right;
    font-family: 'Inter', sans-serif;
  }
  .callout-above .tag {
    display: inline-block; background: #ffffff; border: 2px solid #3d7a8a;
    border-radius: 100px; padding: 16px 34px;
    font-size: 30px; font-weight: 600; color: #1c2b35;
  }
  .callout-above .pct { font-size: 24px; color: #5a6b75; margin-top: 14px; font-weight: 500; }
  .below-list {
    position: absolute; bottom: 130px; right: 170px;
    font-family: 'Inter', sans-serif; text-align: left;
  }
  .below-list .item {
    display: flex; align-items: center; gap: 18px;
    font-size: 34px; font-weight: 500; color: #ffffff;
    margin-bottom: 26px;
  }
  .below-list .item::before {
    content: ''; width: 14px; height: 14px; border-radius: 50%;
    background: #a8ccd6; flex-shrink: 0;
  }
  .brand {
    position: absolute; bottom: 48px; left: 250px;
    font-family: 'DM Serif Display', serif; font-size: 34px; color: #dceaee;
  }
  .brand span { font-family: 'Inter', sans-serif; font-size: 22px; color: #a8ccd6; margin-left: 18px; }
</style>
</head>
<body>
<div class="canvas">
  <svg width="1920" height="1080" viewBox="0 0 1920 1080">
    <!-- water -->
    <rect x="0" y="470" width="1920" height="610" fill="#3d7a8a"/>
    <rect x="0" y="470" width="1920" height="610" fill="#1c2b35" opacity="0.25"/>
    <!-- waterline highlight -->
    <rect x="0" y="470" width="1920" height="5" fill="#a8ccd6"/>
    <!-- iceberg tip (above water) -->
    <polygon points="880,470 960,330 1050,470" fill="#ffffff"/>
    <polygon points="960,330 1050,470 990,470" fill="#dceaee"/>
    <!-- iceberg mass (below water) -->
    <polygon points="830,470 1110,470 1230,640 1100,920 870,970 700,720" fill="#dceaee" opacity="0.92"/>
    <polygon points="1110,470 1230,640 1100,920 990,470" fill="#c3dae1" opacity="0.9"/>
    <polygon points="700,720 870,970 830,470" fill="#eef5f7" opacity="0.85"/>
  </svg>

  <div class="label-top">
    <div class="eyebrow">Shipping AI features</div>
    <h1>The part everyone sees is the smallest part.</h1>
  </div>

  <div class="callout-above">
    <div class="tag">Getting the AI to work</div>
    <div class="pct">about a day</div>
  </div>

  <div class="below-list">
    <div class="item">Model costs</div>
    <div class="item">Rate limits</div>
    <div class="item">Failure handling</div>
    <div class="item">Output constraints</div>
  </div>

  <div class="brand">Clearly, AI <span>learnaiclearly.com</span></div>
</div>
</body>
</html>
