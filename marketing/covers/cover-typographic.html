<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Cover — Typographic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #555; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .canvas {
    width: 1920px; height: 1080px;
    position: relative; overflow: hidden;
    background: #f5f3ee;
    flex-shrink: 0;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 240px;
  }
  .eyebrow {
    font-family: 'Inter', sans-serif; font-size: 28px; font-weight: 600;
    letter-spacing: 4px; text-transform: uppercase; color: #3d7a8a;
    margin-bottom: 44px;
  }
  h1 {
    font-family: 'DM Serif Display', serif; font-weight: 400;
    font-size: 140px; line-height: 1.08; color: #1c2b35;
    max-width: 1440px;
  }
  .rule {
    width: 320px; height: 8px; background: #3d7a8a; border-radius: 4px;
    margin-top: 60px;
  }
  .sub {
    font-family: 'Inter', sans-serif; font-size: 34px; color: #5a6b75;
    margin-top: 52px; max-width: 1100px; line-height: 1.5;
  }
  .brand {
    position: absolute; bottom: 60px; left: 240px;
    font-family: 'DM Serif Display', serif; font-size: 36px; color: #1c2b35;
  }
  .brand span { font-family: 'Inter', sans-serif; font-size: 23px; color: #5a6b75; margin-left: 20px; }
  .corner {
    position: absolute; top: -140px; right: -140px;
    width: 460px; height: 460px; border-radius: 50%;
    background: #3d7a8a; opacity: 0.10;
  }
  .corner2 {
    position: absolute; bottom: -180px; right: 120px;
    width: 320px; height: 320px; border-radius: 50%;
    background: #3d7a8a; opacity: 0.07;
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="corner"></div>
  <div class="corner2"></div>
  <div class="eyebrow">Shipping AI features</div>
  <h1>The AI part took a day.</h1>
  <div class="rule"></div>
  <div class="sub">Everything that made it something strangers could rely on is the story nobody tells.</div>
  <div class="brand">Clearly, AI <span>learnaiclearly.com</span></div>
</div>
</body>
</html>
